version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: nalakarsa_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nalakarsa
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nalakarsa"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nalakarsa_app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ENV=production
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=nalakarsa
      - DB_SSLMODE=disable
      - JWT_SECRET=supersecretjwtkeychangeinproduction
      - JWT_REFRESH_SECRET=supersecretjwtrefreshkeychangeinproduction
      - JWT_ACCESS_EXPIRATION=900
      - JWT_REFRESH_EXPIRATION=604800
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
